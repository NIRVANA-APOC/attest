# The stages the panel draws for this workflow, in order. The orchestrator
# moves the stage (`attest stage <id>`) and opens gates (`attest gate <id>
# "<question>"`). `gate: plan` is the plan gate: every workflow has it, first,
# because dispatch waits for it. A stage whose id is a role group (build,
# review, audit) shows how many roles in that group are done; the audit stage
# counts roles with `group: audit`, such as an optional auditor.
stages:
  - id: plan
    label: Plan
  - id: plan-ok
    label: "Plan OK?"
    gate: plan
  - id: build
    label: Build
  - id: review
    label: Review
  - id: audit
    label: Audit
  - id: mr-ok
    label: "MR OK?"
    gate: mr-ok
  - id: mr
    label: Open MR
  - id: merged
    label: "Merged?"
    gate: merged
  - id: teardown
    label: Teardown
